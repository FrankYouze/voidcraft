[package]
name = "voidcraft"
version = "0.1.0"
description = "Local-first database diagram and whiteboard"
authors = ["Voidcraft"]
edition = "2021"

[lib]
name = "voidcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

